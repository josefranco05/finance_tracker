<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · MyFin</title>
    <meta name="description" content="Inicia sesión en MyFin - Finanzas Personales">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          type="text/css"
          href="{{ url_for('static', path='css/styles.css') }}?v=5">

    <meta name="theme-color" content="#EFE8FB">
    <link rel="icon"
        href="{{ url_for('static', path='icons/icon.png') }}"
        sizes="any">
    <link rel="apple-touch-icon"
        sizes="180x180"
        href="{{ url_for('static', path='icons/icon.png') }}">
  </head>
  <body>
    <div class="auth-shell">
      <main class="auth-card" aria-label="Iniciar sesión">
        <div class="auth-brand">
          <img src="{{ url_for('static', path='icons/icon.png') }}" alt="MyFin" width="64" height="64">
        </div>

        <h1 class="auth-title">Bienvenido de nuevo</h1>
        <p class="auth-sub">Accede a tus finanzas personales</p>

        <!-- TODO(backend): apunta el action al endpoint de autenticación -->
        <form method="post" action="#">
          <div class="field">
            <label for="username">Usuario o correo</label>
            <input type="text" id="username" name="username"
                   placeholder="usuario o correo" autocomplete="username" required>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password"
                   placeholder="••••••••" autocomplete="current-password" required>
          </div>

          <div class="auth-row">
            <label class="check">
              <input type="checkbox" name="remember" value="1">
              Recordarme
            </label>
            <a class="link-btn" href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="btn btn-primary btn--block">Iniciar sesión</button>
        </form>

        <p class="auth-alt">
          ¿Aún no tienes cuenta?
          <a class="link-btn" href="#">Crea una aquí</a>
        </p>
      </main>
    </div>
  </body>
</html>
