{% extends "layout.html" %}

{% block title %}Error {{ status_code | default(404) }} · MyFin{% endblock %}

{% block content %}

<div class="error-page">
  <div class="error-code" aria-hidden="true">{{ status_code }}</div>
  <h1 class="page-title">{{ error_title }}</h1>
  <p class="error-message">{{ error_message }}</p>

  <div class="error-actions">
    <a class="btn btn-primary" href="/">Volver al inicio</a>
    <a class="btn btn-ghost" href="/transactions">Ver transacciones</a>
  </div>
</div>
{% endblock %}
